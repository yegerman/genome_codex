[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnakit"
version = "0.2.0"
description = "Read DNA from sequence files and write it back out"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.scripts]
dnakit = "dnakit.cli:main"

[tool.setuptools]
packages = ["dnakit"]
